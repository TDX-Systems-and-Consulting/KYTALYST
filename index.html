<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KYTALYST — Deal Scanner</title>
<style>
  :root{
    --ink:#12181f;
    --paper:#eef0ea;
    --card:#1b232c;
    --line:#2c3641;
    --copper:#b5652f;
    --copper-bright:#d97f42;
    --green:#4f8f5b;
    --red:#b1483f;
    --muted:#8592a0;
    --widget-scheme: dark;
    --mono: 'IBM Plex Mono', 'SF Mono', Menlo, Consolas, monospace;
    --serif: Georgia, 'Times New Roman', serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  :root[data-theme="light"]{
    --ink:#f2efe6;
    --paper:#1c2420;
    --card:#ffffff;
    --line:#d8d3c4;
    --copper:#a8481f;
    --copper-bright:#c25a2a;
    --green:#2f6b3f;
    --red:#a8382f;
    --muted:#6b6b60;
    --widget-scheme: light;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0;padding:0;background:var(--ink);color:var(--paper);font-family:var(--sans);}
  body{min-height:100vh; padding-bottom:60px;}

  .topbar{
    padding:22px 20px 18px;
    border-bottom:1px solid var(--line);
    display:flex; align-items:baseline; justify-content:space-between;
  }
  .wordmark{font-family:var(--serif); font-size:22px; letter-spacing:0.5px; font-weight:700; color:var(--paper);}
  .wordmark span{color:var(--copper-bright);}
  .tagline{font-family:var(--mono); font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:1.2px;}

  .theme-toggle{
    background:transparent; border:1px solid var(--line); color:var(--muted);
    font-family:var(--mono); font-size:11px; letter-spacing:0.5px; text-transform:uppercase;
    padding:6px 12px; border-radius:20px; cursor:pointer; align-self:flex-start;
  }
  .theme-toggle:active{ border-color:var(--copper); color:var(--copper-bright); }

  .search-panel{padding:24px 20px 8px;}
  .search-label{font-family:var(--mono); font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:1.5px; margin-bottom:10px; display:block;}
  .search-row{display:flex; gap:8px;}
  input[type="text"]{
    flex:1; background:var(--card); border:1px solid var(--line); color:var(--paper);
    font-family:var(--sans); font-size:16px; padding:14px 14px; border-radius:2px; outline:none;
  }
  input[type="text"]:focus{border-color:var(--copper);}
  input[type="text"]::placeholder{color:var(--muted);}
  button.scan-btn{
    background:var(--copper); color:#fff; border:none; font-family:var(--mono);
    font-size:13px; letter-spacing:0.5px; text-transform:uppercase; font-weight:600;
    padding:0 20px; border-radius:2px; cursor:pointer; white-space:nowrap;
  }
  button.scan-btn:active{background:var(--copper-bright);}
  button.scan-btn:disabled{background:#3a4048; color:var(--muted); cursor:default;}

  .status-line{
    font-family:var(--mono); font-size:12px; color:var(--muted); padding:14px 20px 0; min-height:18px;
  }

  .verdict-banner{
    margin:22px 20px 0; padding:20px; border-radius:3px; border:1px solid;
    display:flex; align-items:center; justify-content:space-between;
  }
  .verdict-banner.deal{ background:rgba(79,143,91,0.12); border-color:var(--green); }
  .verdict-banner.nodeal{ background:rgba(177,72,63,0.12); border-color:var(--red); }
  .verdict-word{font-family:var(--serif); font-size:28px; font-weight:700;}
  .verdict-banner.deal .verdict-word{color:var(--green);}
  .verdict-banner.nodeal .verdict-word{color:#e08b83;}
  .verdict-sub{font-family:var(--mono); font-size:12px; color:var(--muted); margin-top:4px;}
  .status-badge{
    display:inline-block; margin-top:8px; font-family:var(--mono); font-size:10.5px;
    font-weight:600; letter-spacing:0.5px; text-transform:uppercase;
    padding:3px 9px; border-radius:20px; border:1px solid;
  }
  .status-badge.active{ color:var(--green); border-color:var(--green); background:rgba(79,143,91,0.12); }
  .status-badge.inactive{ color:#e08b83; border-color:var(--red); background:rgba(177,72,63,0.12); }
  .verdict-profit{text-align:right;}
  .verdict-profit .num{font-family:var(--mono); font-size:22px; font-weight:600;}
  .verdict-profit .lbl{font-family:var(--mono); font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:1px;}

  .metrics-grid{
    display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--line);
    margin:16px 20px 0; border:1px solid var(--line); border-radius:3px; overflow:hidden;
  }
  .metric-cell{background:var(--card); padding:14px 16px;}
  .metric-cell .lbl{font-family:var(--mono); font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:0.8px; display:block; margin-bottom:6px;}
  .metric-cell .val{font-family:var(--mono); font-size:17px; font-weight:600; color:var(--paper);}

  .section{margin:24px 20px 0;}
  .section-head{font-family:var(--mono); font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:1.5px; margin-bottom:10px;}

  .chip-row{display:flex; flex-wrap:wrap; gap:6px;}
  .chip{
    font-family:var(--mono); font-size:11px; background:rgba(213,127,66,0.15); color:var(--copper-bright);
    padding:5px 10px; border-radius:20px; border:1px solid rgba(213,127,66,0.3);
  }

  .comp-row{
    display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--line);
    font-family:var(--mono); font-size:13px;
  }
  .comp-row:last-child{border-bottom:none;}
  .comp-addr{color:var(--paper);}
  .comp-price{color:var(--muted);}

  .rehab-breakdown{font-family:var(--mono); font-size:12px; color:var(--muted); line-height:1.9;}
  .rehab-breakdown .rline{display:flex; justify-content:space-between;}
  .rehab-breakdown .rline b{color:var(--paper); font-weight:500;}

  .agent-card{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--card); border:1px solid var(--line); border-radius:3px; padding:14px 16px;
  }
  .agent-name{font-family:var(--serif); font-size:15px; color:var(--paper); font-weight:700;}
  .agent-office{font-family:var(--mono); font-size:11px; color:var(--muted); margin-top:2px;}
  .agent-actions{display:flex; gap:8px;}
  .agent-btn{
    font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:0.5px;
    text-decoration:none; padding:8px 14px; border-radius:20px; border:1px solid var(--copper);
    color:var(--copper-bright); white-space:nowrap;
  }
  .agent-btn:active{ background:var(--copper); color:#fff; }

  .walkthrough-box{
    background:var(--card); border:1px solid var(--line); border-radius:3px; padding:16px;
  }
  .wt-row{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:8px;}
  .wt-row select, .wt-row input{
    background:var(--ink); color:var(--paper); border:1px solid var(--line);
    font-family:var(--sans); font-size:14px; padding:10px; border-radius:2px; outline:none; width:100%;
  }
  .wt-qty-add{display:flex; gap:8px;}
  .wt-qty-add input{width:70px; flex:none;}
  .wt-add-btn{
    flex:1; background:var(--green); color:#fff; border:none; font-family:var(--mono);
    font-size:12px; text-transform:uppercase; letter-spacing:0.5px; font-weight:600;
    border-radius:2px; cursor:pointer;
  }
  .wt-item-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:9px 0; border-bottom:1px solid var(--line); font-family:var(--mono); font-size:12.5px;
  }
  .wt-item-row:last-of-type{border-bottom:none;}
  .wt-item-desc{color:var(--paper);}
  .wt-item-sub{color:var(--muted); font-size:11px; margin-top:1px;}
  .wt-item-right{display:flex; align-items:center; gap:10px;}
  .wt-item-cost{color:var(--paper); font-weight:600;}
  .wt-remove{
    background:transparent; border:1px solid var(--red); color:#e08b83; border-radius:20px;
    font-family:var(--mono); font-size:10px; padding:3px 8px; cursor:pointer;
  }
  .wt-total-row{
    display:flex; justify-content:space-between; align-items:center;
    margin-top:12px; padding-top:12px; border-top:1px solid var(--line);
    font-family:var(--mono); font-weight:700; color:var(--paper);
  }
  .wt-empty{font-family:var(--mono); font-size:11.5px; color:var(--muted); padding:8px 0;}
  .wt-source-note{font-family:var(--mono); font-size:10px; color:var(--muted); margin-top:10px; line-height:1.5;}

  .wt-search-results{
    max-height:260px; overflow-y:auto; border:1px solid var(--line); border-radius:2px; margin-bottom:8px;
  }
  .wt-search-row{
    display:flex; justify-content:space-between; align-items:center; padding:10px 12px;
    border-bottom:1px solid var(--line); cursor:pointer;
  }
  .wt-search-row:last-child{border-bottom:none;}
  .wt-search-row:active, .wt-search-row.selected{background:rgba(213,127,66,0.12);}
  .wt-search-main{font-family:var(--sans); font-size:13.5px; color:var(--paper);}
  .wt-search-sub{font-family:var(--mono); font-size:10.5px; color:var(--muted); margin-top:2px;}
  .wt-search-price{font-family:var(--mono); font-size:13px; color:var(--copper-bright); font-weight:600; white-space:nowrap; padding-left:10px;}

  .formula-muted{
    font-family:var(--mono); font-size:11px; color:var(--muted); font-style:italic;
    padding:4px 0;
  }

  .empty-state{padding:60px 20px; text-align:center;}
  .empty-state .glyph{font-size:32px; opacity:0.3; margin-bottom:14px;}
  .empty-state p{font-family:var(--mono); font-size:12px; color:var(--muted); max-width:280px; margin:0 auto; line-height:1.7;}


  /* Places Autocomplete container — wraps Google's element to match the existing input look */
  /* Places Autocomplete — Google added real CSS support for these directly on the element */
  .address-autocomplete-wrap{
    flex:1; position:relative; z-index:10;
  }
  .address-autocomplete-wrap gmp-place-autocomplete{
    width:100%;
    color-scheme: var(--widget-scheme);
    background-color: var(--card);
    border: 1px solid var(--line);
    border-radius: 2px;
  }

  body{max-width:960px;margin:0 auto;}
  .budget-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px 0;}
  .budget-grid label,.budget-field{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted);min-width:0;}
  .budget-grid input,.budget-grid select,.budget-field input{box-sizing:border-box;min-width:0;width:100%;background:var(--ink);color:var(--paper);border:1px solid var(--line);border-radius:3px;padding:11px;font:inherit;font-size:16px;}
  .budget-wide{grid-column:1/-1;}
  .budget-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;align-items:center;}
  .budget-btn{border:1px solid var(--copper);background:var(--copper);color:white;padding:11px 14px;border-radius:3px;cursor:pointer;font:inherit;font-size:13px;}
  .budget-btn.secondary{background:transparent;color:var(--copper-bright);}
  .budget-item{border:1px solid var(--line);border-radius:3px;padding:12px;margin:12px 0;}
  .budget-item-head{display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .budget-item-head strong{overflow-wrap:anywhere;}
  .budget-note{color:var(--muted);font-size:12px;line-height:1.6;margin:8px 0;}
  .budget-status{color:var(--copper-bright);font-size:12px;line-height:1.6;}
  .budget-summary{display:grid;gap:10px;margin:14px 0;font-family:var(--mono);font-size:13px;}
  .budget-summary div{display:flex;justify-content:space-between;gap:12px;}
  .budget-summary .total{border-top:1px solid var(--line);padding-top:12px;font-size:16px;}
  .budget-error{color:#e08b83;font-size:13px;line-height:1.6;}
  .verdict-banner.pending{border-color:var(--copper);background:rgba(181,101,47,0.12);}
  button:focus-visible,input:focus-visible{outline:2px solid var(--copper-bright);outline-offset:3px;}
  .search-row{display:grid;grid-template-columns:minmax(0,1fr) auto;}
  .search-row>*{min-width:0;}
  .address-autocomplete-wrap{grid-column:auto;}
  [hidden]{display:none!important;}
  .address-mode-btn{border:0;background:transparent;color:var(--muted);padding:8px 0;font:inherit;font-size:12px;cursor:pointer;}
  .hipshot-range{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px;}
  .hipshot-range>div{border:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0;}
  .hipshot-range span{font-size:12px;color:var(--muted);}
  .hipshot-range strong{font-family:var(--mono);font-size:16px;overflow-wrap:anywhere;}
  .address-autocomplete-wrap:empty{display:none;}
  @media(max-width:500px){.verdict-word{font-size:21px;}.verdict-sub{font-size:11px;}.verdict-profit .num{font-size:19px;}}
  @media(min-width:700px){.budget-item .budget-grid{grid-template-columns:repeat(3,minmax(0,1fr));}}
</style>

  <div class="topbar">
    <div>
      <div class="wordmark">KYTA<span>LYST</span></div>

<script>
// --- Light/Dark theme toggle (same pattern as JOBSpan) ---
function applyTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);
  try { localStorage.setItem('kytalyst-theme', theme); } catch (_) {}
  const btn = document.getElementById('themeToggleBtn');
  if (btn) btn.textContent = theme === 'light' ? '🌙 Dark' : '☀ Light';
}
function toggleTheme(){
  const current = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
  applyTheme(current === 'light' ? 'dark' : 'light');
}
let savedTheme = 'dark';
try { savedTheme = localStorage.getItem('kytalyst-theme') || 'dark'; } catch (_) {}
applyTheme(savedTheme);

// Live KYTALYST backend — deployed 7/15/26
const CLOUD_FUNCTION_URL = "https://us-central1-kytrac-72d91.cloudfunctions.net/kytalystScan";

let lastScanData = null;
let hipshotAmount = '';
let hipshotSaved = false;
let budgetStorageMessage = '';
let autocompleteElement = null;

function escapeHtml(value){
  return String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function formatCost(value){
  return Number(value).toLocaleString('en-US', {style:'currency', currency:'USD'});
}
function saveBudget(){
  try {
    localStorage.setItem(RehabBudget.key(lastScanData.address), JSON.stringify({version:2, amount:hipshotAmount}));
    budgetStorageMessage = 'Saved for this property on this browser.';
  } catch (_) {
    budgetStorageMessage = 'Keep this page open; browser storage is unavailable.';
  }
}
function loadBudget(address){
  hipshotAmount = '';
  hipshotSaved = false;
  budgetStorageMessage = '';
  try {
    const saved = localStorage.getItem(RehabBudget.key(address));
    if (saved) {
      hipshotAmount = RehabBudget.restore(JSON.parse(saved)).amount;
      hipshotSaved = hipshotAmount !== '';
      budgetStorageMessage = 'Restored for this property.';
    }
  } catch (_) {
    budgetStorageMessage = 'Saved estimate unavailable. Enter your Hipshot below.';
  }
}
function updateHipshot(input){
  // Clear the old estimate immediately when the field is empty or invalid.
  hipshotAmount = input.value;
  hipshotSaved = false;
  budgetStorageMessage = 'Unsaved changes — tap Save Hipshot.';
  refreshBudgetSummary();
  refreshDealMetrics();
}
function saveHipshot(){
  const input = document.getElementById('hipshotInput');
  hipshotAmount = input.value;
  hipshotSaved = false;
  try {
    const range = RehabBudget.hipshot(hipshotAmount);
    hipshotAmount = range.amount;
    input.value = range.amount;
    hipshotSaved = true;
    saveBudget();
    input.blur();
    refreshBudgetSummary();
    refreshDealMetrics();
  } catch (_) {
    refreshBudgetSummary();
    refreshDealMetrics();
    if (typeof RehabBudget !== 'undefined' && typeof RehabBudget.hipshot === 'function') {
      document.getElementById('budgetError').textContent = 'Enter a valid rehab budget of zero or greater, then tap Save Hipshot.';
    }
    document.getElementById('budgetStorage').textContent = 'Not saved.';
  }
}
function refreshBudgetSummary(){
  let range = null;
  let calculatorReady = typeof RehabBudget !== 'undefined' && typeof RehabBudget.hipshot === 'function';
  try { range = RehabBudget.hipshot(hipshotAmount); } catch (_) {}
  document.getElementById('hipshotLow').textContent = range ? formatCost(range.low) : '—';
  document.getElementById('hipshotHigh').textContent = range ? formatCost(range.high) : '—';
  document.getElementById('budgetError').textContent = !calculatorReady
    ? 'The calculator could not load. Refresh this page and try again.'
    : hipshotAmount !== '' && !range ? 'Enter a rehab budget of zero or greater.' : '';
  document.getElementById('budgetStorage').textContent = budgetStorageMessage;
}
function toggleAddressEntry(){
  if (!autocompleteElement) return;
  const input = document.getElementById('addressInput');
  const mount = document.getElementById('autocompleteMount');
  const useManual = input.hidden;
  input.hidden = !useManual;
  mount.hidden = useManual;
  document.getElementById('addressModeBtn').textContent = useManual ? 'Use address suggestions' : 'Enter address manually';
  if (useManual) input.focus();
  else {
    input.value = typeof autocompleteElement.value === 'string' ? autocompleteElement.value : '';
    autocompleteElement.focus();
  }
}

function applyAnalysisInputs(){
  try {
    const listPrice = document.getElementById('analysisPrice').value;
    const arv = document.getElementById('analysisArv').value;
    RehabBudget.evaluate({listPrice,arv,rehabTotal:0});
    lastScanData.listPrice = Number(listPrice);
    lastScanData.arv = Number(arv);
    refreshDealMetrics();
    document.getElementById('analysisError').textContent = '';
  } catch(err){ document.getElementById('analysisError').textContent = err.message; }
}
function refreshDealMetrics(){
  let range = null;
  let deal = null;
  try {
    range = RehabBudget.hipshot(hipshotAmount);
    if (hipshotSaved) deal = RehabBudget.evaluate({listPrice:lastScanData.listPrice,arv:lastScanData.arv,rehabTotal:range.amount});
  } catch (_) {}
  document.getElementById('verdictBanner').className = 'verdict-banner ' + (deal ? (deal.isDeal ? 'deal' : 'nodeal') : 'pending');
  document.getElementById('verdictWord').textContent = deal ? (deal.isDeal ? 'DEAL' : 'NO DEAL') : (range ? (hipshotSaved ? 'ENTER PRICE / ARV' : 'SAVE HIPSHOT') : 'HIPSHOT NEEDED');
  document.getElementById('projectedProfit').textContent = deal ? money(deal.projectedProfit) : '—';
  document.getElementById('metricRehab').textContent = range ? (hipshotSaved ? formatCost(range.amount) : 'Save Hipshot') : 'Enter Hipshot';
  document.getElementById('metricMao').textContent = deal ? money(deal.mao) : '—';
  document.getElementById('metricPrice').textContent = money(lastScanData.listPrice);
  document.getElementById('metricArv').textContent = lastScanData.arv > 0 ? money(lastScanData.arv) : 'Enter ARV';
}
function renderBudget(){
  return `
    <div class="section">
      <div class="section-head">Hipshot</div>
      <div class="walkthrough-box">
        <label class="budget-field">Your rehab budget ($)
          <input id="hipshotInput" type="number" min="0" step="0.01" inputmode="decimal" placeholder="e.g. 30000" value="${escapeHtml(hipshotAmount)}" oninput="updateHipshot(this)" onkeydown="if(event.key==='Enter'){event.preventDefault();saveHipshot();}">
        </label>
        <button type="button" id="saveHipshotBtn" class="budget-btn" style="margin-top:12px;" onclick="saveHipshot()">Save Hipshot</button>
        <div class="hipshot-range" aria-live="polite">
          <div><span>−10%</span><strong id="hipshotLow">—</strong></div>
          <div><span>+10%</span><strong id="hipshotHigh">—</strong></div>
        </div>
        <p class="budget-note">Save your budget to update profit and max offer.</p>
        <div id="budgetError" class="budget-error" role="alert"></div>
        <p id="budgetStorage" class="budget-note" role="status"></p>
      </div>
    </div>`;
}

// --- Google Places Autocomplete (frontend-only; does not touch kytalystScan or RentCast calls) ---
(async function initAutocomplete(){
  try {
    const { PlaceAutocompleteElement } = await google.maps.importLibrary("places");

    const autocompleteEl = new PlaceAutocompleteElement({
      includedRegionCodes: ["us"],
      includedPrimaryTypes: ["street_address", "premise", "subpremise"]
    });
    autocompleteEl.placeholder = "Property address…";
    autocompleteEl.setAttribute('aria-label', 'Property address suggestions');
    document.getElementById('autocompleteMount').appendChild(autocompleteEl);
    autocompleteElement = autocompleteEl;

    const hiddenInput = document.getElementById('addressInput');
    const manualMode = !!hiddenInput.value;
    hiddenInput.hidden = !manualMode;
    document.getElementById('autocompleteMount').hidden = manualMode;
    document.getElementById('addressModeBtn').hidden = false;
    document.getElementById('addressModeBtn').textContent = manualMode ? 'Use address suggestions' : 'Enter address manually';

    // Fallback: if the user types a full address but never picks a dropdown suggestion,
    // keep the hidden field in sync with their raw typed text so Scan still works.
    autocompleteEl.addEventListener('input', () => {
      hiddenInput.value = typeof autocompleteEl.value === 'string' ? autocompleteEl.value : '';
    });

    // On selection: parse into clean, structured "Street, City, State, Zip" — what RentCast expects.
    autocompleteEl.addEventListener('gmp-select', async ({ placePrediction }) => {
      const place = placePrediction.toPlace();
      await place.fetchFields({ fields: ['addressComponents', 'formattedAddress'] });

      const comps = place.addressComponents || [];
      const get = (type) => comps.find(c => c.types && c.types.includes(type));

      const streetNumber = get('street_number')?.longText || '';
      const route = get('route')?.longText || '';
      const city = (get('locality') || get('sublocality'))?.longText || '';
      const state = get('administrative_area_level_1')?.shortText || '';
      const zip = get('postal_code')?.longText || '';

      const streetLine = [streetNumber, route].filter(Boolean).join(' ');
      const cleanAddress = [streetLine, city, [state, zip].filter(Boolean).join(' ')]
        .filter(Boolean).join(', ');

      hiddenInput.value = cleanAddress || place.formattedAddress || autocompleteEl.value || '';
    });
  } catch (err) {
    console.warn('Places Autocomplete unavailable; use the address field:', err);
  }
})();

function showFSBOForm(address) {
  // Show the manual override button (in case it was hidden)
  const manualBtn = document.getElementById('fsboManualBtn');
  if (manualBtn) manualBtn.style.display = 'block';

  const emptyState = document.getElementById('emptyState');
  emptyState.style.display = 'block';
  document.getElementById('resultsWrap').innerHTML = '';
  emptyState.innerHTML = `
    <div class="glyph">⌂</div>
    <p style="margin-bottom:6px;"><strong>No active listing found</strong> for this address.</p>
    <p style="font-size:13px; color:var(--muted); margin-bottom:16px;">This may be For Sale By Owner or off-market. Enter the asking price below to run your analysis.</p>
    <div style="display:flex; gap:8px; align-items:center; max-width:340px; margin:0 auto;">
      <input type="number" id="fsboPriceInput" placeholder="Asking price" min="0" step="1000"
        style="flex:1; padding:10px 12px; background:var(--card); border:1px solid var(--line); border-radius:7px; color:var(--paper); font-family:var(--mono); font-size:15px; outline:none;"
        onkeydown="if(event.key==='Enter') applyFSBOPrice()">
      <button onclick="applyFSBOPrice()"
        style="padding:10px 18px; background:var(--copper); border:none; border-radius:7px; color:#fff; font-family:var(--mono); font-size:13px; letter-spacing:0.5px; cursor:pointer; white-space:nowrap;">
        Analyze ▶
      </button>
    </div>
  `;
  setTimeout(() => { const el = document.getElementById('fsboPriceInput'); if(el) el.focus(); }, 100);
}

function applyFSBOPrice() {
  const input = document.getElementById('fsboPriceInput');
  const price = parseFloat(input ? input.value : 0);
  if (!price || price <= 0) {
    if (input) input.style.border = '1px solid var(--red)';
    return;
  }
  // Merge asking price into whatever data the backend already returned
  // (lastScanData has real AVM comps + ARV even for no-listing addresses)
  const existing = lastScanData || {};
  lastScanData = {
    ...existing,
    listPrice: price,                            // user's asking price
    listingStatus: 'FSBO / Off-Market',
    distressSignals: existing.distressSignals || [],
    rehabTier: existing.rehabTier || 'none',
    comps: existing.comps || [],                 // real comps from AVM
    _isFSBO: true,
  };

  document.getElementById('emptyState').style.display = 'none';
  renderResults();
}

function money(n){
  const sign = n < 0 ? "-" : "";
  return sign + "$" + Math.abs(Math.round(n)).toLocaleString();
}

async function fetchRealScan(address){
  const res = await fetch(CLOUD_FUNCTION_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ address })
  });
  if(!res.ok){
    const errBody = await res.json().catch(() => ({}));
    const err = new Error(errBody.error || ("Backend returned " + res.status));
    err.status = res.status;
    throw err;
  }
  return await res.json();
}

async function runScan(){
  const address = document.getElementById('addressInput').value.trim();
  if(!address) {
    document.getElementById('statusLine').textContent = 'Enter an address or choose one from the suggestions.';
    return;
  }
  const btn = document.getElementById('scanBtn');
  const statusLine = document.getElementById('statusLine');
  btn.disabled = true;
  statusLine.textContent = "Pulling property data + comps…";
  document.getElementById('resultsWrap').innerHTML = "";
  document.getElementById('emptyState').style.display = "none";
  lastScanData = null;
  document.getElementById('fsboManualBtn').style.display = 'none';

  let data;

  try{
    data = await fetchRealScan(address);
    data.address = data.address || address;
    loadBudget(data.address);
    // Backend now returns 200 even for FSBO/off-market — check the flag
    if (data.listingNotFound) {
      statusLine.textContent = "";
      // Store the partial data (has comps + ARV from AVM) so FSBO form can merge it
      lastScanData = data;
      showFSBOForm(address);
      btn.disabled = false;
      return;
    }
  }catch(err){
    console.warn('Live scan failed:', err.message);
    statusLine.textContent = 'Scan failed: ' + err.message + '. No sample data is used. Try again.';
    lastScanData = null;
    btn.disabled = false;
    return;
  }

  statusLine.textContent = "";
  btn.disabled = false;

  lastScanData = data;
  // After a live scan succeeds, show the manual override button
  const manualBtn = document.getElementById('fsboManualBtn');
  if (manualBtn) manualBtn.style.display = 'block';
  renderResults();
}

function renderResults(){
  const data = lastScanData;
  if (!data) return;

  const fsboBadge = data._isFSBO
    ? `<div style="margin-top:6px; display:inline-block; padding:3px 10px; background:rgba(181,101,47,0.18); border:1px solid var(--copper); border-radius:5px; font-family:var(--mono); font-size:10px; letter-spacing:0.8px; color:var(--copper-bright);">FSBO / OFF-MARKET</div>`

      </div>

      <div id="analysisError" class="budget-error" role="alert"></div>

    </div>`;

  const GKEY = "AIzaSyBBJGJy8fxsb5C63eCXQnq1MN14OX8D5-0";
  const svUrl = (addr, w=640, h=200) =>
    `https://maps.googleapis.com/maps/api/streetview?size=${w}x${h}&location=${encodeURIComponent(addr)}&fov=90&pitch=5&key=${GKEY}`;

  const wrap = document.getElementById('resultsWrap');

      <div style="position:relative; width:100%; height:180px; overflow:hidden; border-radius:10px 10px 0 0;">
        <img src="${svUrl(data.address)}" alt="Street view" style="width:100%; height:100%; object-fit:cover; display:block;" onerror="this.style.display='none'">
        <div style="position:absolute; inset:0; background:linear-gradient(to bottom, rgba(0,0,0,0.05), rgba(0,0,0,0.7));"></div>
        <div style="position:absolute; bottom:12px; left:14px; right:14px; display:flex; justify-content:space-between; align-items:flex-end;">
          <div>
            <div id="verdictWord" class="verdict-word" style="margin:0;">HIPSHOT NEEDED</div>
            <div class="verdict-sub" style="color:rgba(255,255,255,0.8);">${escapeHtml(data.address)}</div>
            ${fsboBadge}
            ${!data._isFSBO ? `<div class="status-badge ${data.listingStatus === 'Active' ? 'active' : 'inactive'}" style="margin-top:4px;">
              ${data.listingStatus === 'Active' ? 'Active on Market' : escapeHtml(data.listingStatus)}
            </div>` : ''}
          </div>
          <div class="verdict-profit" style="text-align:right; flex-shrink:0; margin-left:12px;">
            <div class="num" id="projectedProfit">—</div>
            <div class="lbl">Projected Profit</div>
          </div>
        </div>
      </div>
    </div>

    ${analysisInputs}
    <div class="metrics-grid">
      <div class="metric-cell"><span class="lbl">${data._isFSBO ? 'Asking Price' : 'List Price'}</span><span class="val" id="metricPrice">${money(data.listPrice)}</span></div>
      <div class="metric-cell"><span class="lbl">ARV</span><span class="val" id="metricArv">${money(data.arv)}</span></div>
      <div class="metric-cell"><span class="lbl">Rehab budget</span><span class="val" id="metricRehab">Draft</span></div>
      <div class="metric-cell"><span class="lbl">Max Offer (MAO)</span><span class="val" id="metricMao">—</span></div>

      <div class="chip-row">
        ${(data.distressSignals && data.distressSignals.length) ? data.distressSignals.map(s => `<span class="chip">${escapeHtml(s)}</span>`).join('') : '<span class="chip">none detected</span>'}
      </div>
    </div>

    ${renderBudget()}

    <div class="section">
      <div class="section-head">RentCast valuation comparables</div>
      <p class="budget-note">These are valuation comparables returned by RentCast; closed-sale status and renovated condition have not been independently verified.</p>
      ${(data.comps && data.comps.length) ? data.comps.map(c => {
        const details = [
          c.beds ? `${c.beds}bd` : null,
          c.baths ? `${c.baths}ba` : null,

        <div class="agent-actions">

  refreshBudgetSummary();

}
