name: Test deal analyzer

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm ci
        working-directory: functions
      - run: npx playwright install --with-deps chromium
      - run: mkdir -p test-screenshots
      # Unit + DOM tests, the scan function's access control, and browser checks,
      # Firestore security rules, all inside Firebase emulators (no real accounts, no paid API calls).
      - run: npm run test:all
        env:
          SCREENSHOT_DIR: test-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: test-screenshots/
          if-no-files-found: ignore
