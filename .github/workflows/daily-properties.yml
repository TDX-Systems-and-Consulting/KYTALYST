name: Refresh daily property matches
on:
  schedule:
    - cron: '0 13 * * *'
  push:
    branches: [main]
    paths: ['buy-box.js', '.github/workflows/daily-properties.yml']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: daily-property-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch active matches and value candidates
        run: node scripts/refresh-daily.cjs
        env:
          RENTCAST_API_KEY: ${{ secrets.RENTCAST_API_KEY }}
      - name: Save the refreshed feed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/daily.json
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh daily property matches'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Publish the refreshed feed through existing GitHub Pages
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" --jq '.status'
        env:
          GH_TOKEN: ${{ github.token }}
